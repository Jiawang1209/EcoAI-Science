# 测试独立于发布；失败不丢弃其他平台已经生成的发布产物。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
        # 独立进程和日志：一个项目挂住时，另一个项目仍能给出结论。
        project: [node, ui]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux 依赖（node-pty 现场编译）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm run typecheck
      # Windows 的路径/权限移植、依赖本机 kernelspec 的 kernel project 另行验收。
      # Linux 旧运行停在测试中途，最后未报告的 suite 含 /proc mkdirSync 失败夹具。
      # 已换成可移植的 ENOTDIR 夹具；仍需真正 Linux runner 验证，不能靠延长超时判绿。
      - name: Test ${{ matrix.project }} with isolated workers
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          node --version
          npx vitest run --project '${{ matrix.project }}' --pool=forks --maxWorkers=2 --reporter=verbose --reporter=hanging-process 2>&1 | tee 'vitest-${{ matrix.project }}.log'
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}-${{ matrix.project }}
          path: vitest-${{ matrix.project }}.log
          if-no-files-found: ignore
